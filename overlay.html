<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bandeau overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  #ticker-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 56px;
    background: linear-gradient(90deg, rgba(27,10,63,0.47), rgba(108,27,143,0.47), rgba(194,30,107,0.47), rgba(108,27,143,0.47), rgba(27,10,63,0.47));
    border-top: 3px solid #ffd76a;
    display: flex;
    align-items: center;
    overflow: hidden;
    box-sizing: border-box;
    transition: height 0.25s ease, background 0.25s ease, border-color 0.25s ease;
  }

  #ticker-bar.tts-mode {
    height: 96px;
    background: linear-gradient(90deg, rgba(27,10,63,0.55), rgba(122,21,82,0.55), rgba(27,10,63,0.55));
    border-top-color: #ff5fa2;
  }

  /* --- Mode ticker (defilement) --- */
  #ticker-scroll {
    white-space: nowrap;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
  }

  #ticker-text {
    display: inline-block;
    color: #fff;
    font-family: 'Anton', Impact, 'Arial Black', Arial, sans-serif;
    font-size: 25px;
    font-weight: 400;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 0 #1b0a3f, 2px 2px 0 #1b0a3f;
  }

  #ticker-text .author {
    color: #ffe9b3;
    margin-right: 10px;
  }

  #ticker-text .emote {
    height: 1.5em;
    width: auto;
    vertical-align: middle;
    margin: 0 2px;
  }

  #ticker-text .filler-tag {
    color: #ffd76a;
    margin-right: 8px;
  }

  #ticker-text .filler-tag.zevent {
    color: #39ff14;
  }

  #ticker-text .zevent-text {
    color: #39ff14;
    text-shadow: 0 0 8px rgba(57, 255, 20, 0.85), 2px 2px 0 #063d0c;
  }

  /* --- Mode TTS (style sous-titre) --- */
  #tts-caption {
    display: none;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 32px;
    box-sizing: border-box;
    color: #fff;
    font-family: 'Anton', Impact, Arial, sans-serif;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 0 #1b0a3f, 2px 2px 0 #1b0a3f;
  }

  #tts-caption .tts-icon {
    margin-right: 14px;
    font-size: 36px;
    flex-shrink: 0;
  }

  #ticker-bar.tts-mode #ticker-scroll { display: none; }
  #ticker-bar.tts-mode #tts-caption { display: flex; }
</style>
</head>
<body>
  <div id="ticker-bar">
    <div id="ticker-scroll">
      <span id="ticker-text"></span>
    </div>
    <div id="tts-caption">
      <span class="tts-icon">🔊</span>
      <span id="tts-text"></span>
    </div>
  </div>

<script>
(() => {
  // ====== CONFIG ======
  // Laisse vide pour auto-detecter (utilise l'hote de la page).
  const WS_HOST_OVERRIDE = '';
  const SCROLL_SPEED_PX_PER_SEC = 160;   // vitesse de defilement du bandeau
  const PLAYS_BEFORE_DROP = 2;           // nb de passages avant disparition
  const TTS_MS_PER_CHAR = 70;            // duree d'affichage TTS ~ proportionnelle au texte
  const TTS_MIN_MS = 3000;
  const TTS_MAX_MS = 12000;
  const RECONNECT_DELAY_MS = 2000;
  const FILLER_IDLE_MS = 0;              // pause entre deux fun facts/horoscopes (0 = desactivee)
  // =====================

  const bar = document.getElementById('ticker-bar');
  const tickerScroll = document.getElementById('ticker-scroll');
  const tickerText = document.getElementById('ticker-text');
  const ttsCaption = document.getElementById('tts-caption');
  const ttsText = document.getElementById('tts-text');

  const chatQueue = [];
  const ttsQueue = [];
  let running = false;
  let emoteMap = {};
  let fillerItems = [];
  let fillerIndex = 0;

  // Recupere la liste des emotes (Twitch/BTTV/7TV/FFZ) servie par le serveur.
  // Rafraichie a l'ouverture de l'overlay, puis toutes les 30 min (au cas ou
  // l'overlay reste ouvert tout un long live pendant que la liste cote
  // serveur se met a jour).
  function loadEmotes() {
    fetch('/emotes')
      .then((r) => (r.ok ? r.json() : {}))
      .then((map) => { emoteMap = map || {}; })
      .catch(() => {});
  }
  loadEmotes();
  setInterval(loadEmotes, 30 * 60 * 1000);

  // Contenu de remplissage (fun facts + horoscope hebdo) affiche pendant les
  // moments creux. Rafraichi toutes les heures (au cas ou on change de
  // semaine pendant un tres long live, meme si ca reste rare).
  function loadFiller() {
    fetch('/filler')
      .then((r) => (r.ok ? r.json() : { items: [] }))
      .then((data) => {
        fillerItems = (data && data.items) || [];
        kick();
      })
      .catch(() => {});
  }
  loadFiller();
  setInterval(loadFiller, 60 * 60 * 1000);

  function wsUrl() {
    const host = WS_HOST_OVERRIDE || location.host;
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    return `${proto}${host}/ws`;
  }

  function connect() {
    let ws;
    try {
      ws = new WebSocket(wsUrl());
    } catch (e) {
      setTimeout(connect, RECONNECT_DELAY_MS);
      return;
    }
    ws.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (!msg || !msg.text) return;
        if (msg.type === 'tts') {
          ttsQueue.push(msg);
        } else {
          chatQueue.push({ ...msg, remaining: PLAYS_BEFORE_DROP });
        }
        kick();
      } catch (e) {
        console.error('message illisible', e);
      }
    };
    ws.onclose = () => setTimeout(connect, RECONNECT_DELAY_MS);
    ws.onerror = () => ws.close();
  }
  connect();

  function kick() {
    if (running) return;
    running = true;
    step();
  }

  async function step() {
    if (ttsQueue.length) {
      await playTts(ttsQueue.shift());
      step();
      return;
    }
    if (chatQueue.length) {
      // File "round-robin" : chaque message repasse en fin de file apres son
      // affichage tant qu'il lui reste des passages. Ca entrelace les
      // messages (A, B, A, B, ...) au lieu de rejouer deux fois de suite le
      // meme message avant de passer au suivant.
      const item = chatQueue.shift();
      await playChat(item);
      item.remaining -= 1;
      if (item.remaining > 0) {
        chatQueue.push(item);
      }
      step();
      return;
    }
    if (fillerItems.length) {
      // Moment creux : on comble avec un fun fact / horoscope. On revient a
      // chaque tour verifier chatQueue/ttsQueue en premier, donc un vrai
      // message reprend toujours la main des que l'item de remplissage en
      // cours finit de defiler.
      const item = fillerItems[fillerIndex % fillerItems.length];
      fillerIndex += 1;
      await playFiller(item);
      // Pause optionnelle entre deux fun facts (desactivee par defaut,
      // FILLER_IDLE_MS = 0). Utile si jamais le bandeau redevient trop
      // gourmand un jour : on peut remettre une pause ici sans tout
      // reecrire. La pause est interrompue des qu'un vrai message
      // (chat/TTS) arrive, donc ca ne retarderait jamais le vrai contenu.
      if (FILLER_IDLE_MS > 0) {
        await waitUnlessQueued(FILLER_IDLE_MS);
      }
      step();
      return;
    }
    running = false;
  }

  function waitUnlessQueued(ms) {
    return new Promise((resolve) => {
      const start = Date.now();
      const iv = setInterval(() => {
        if (chatQueue.length || ttsQueue.length || Date.now() - start >= ms) {
          clearInterval(iv);
          resolve();
        }
      }, 500);
    });
  }

  function resetAnimations() {
    tickerText.getAnimations().forEach((a) => a.cancel());
  }

  function playChat(item) {
    return new Promise((resolve) => {
      resetAnimations();
      bar.classList.remove('tts-mode');

      tickerText.innerHTML =
        (item.author ? `<span class="author">${escapeHtml(item.author)} :</span>` : '') +
        renderTextWithEmotes(item.text);

      // Les emotes chargent de facon asynchrone : on attend qu'elles soient
      // pretes avant de mesurer la largeur du texte, sinon l'animation de
      // defilement est calculee sur une largeur fausse (trop courte).
      waitForImages(tickerText).then(() => {
        const barWidth = bar.getBoundingClientRect().width;
        const textWidth = tickerText.getBoundingClientRect().width;
        const distance = barWidth + textWidth;
        const durationMs = Math.max(1500, (distance / SCROLL_SPEED_PX_PER_SEC) * 1000);

        const anim = tickerText.animate(
          [
            { transform: `translateX(${barWidth}px)` },
            { transform: `translateX(-${textWidth}px)` },
          ],
          { duration: durationMs, easing: 'linear', fill: 'forwards' }
        );
        anim.onfinish = resolve;
        anim.oncancel = resolve;
      });
    });
  }

  function waitForImages(container) {
    const imgs = Array.from(container.querySelectorAll('img'));
    if (!imgs.length) return Promise.resolve();
    return Promise.all(
      imgs.map((img) => (img.complete ? Promise.resolve() : new Promise((res) => {
        img.onload = res;
        img.onerror = res;
      })))
    );
  }

  // Remplace les codes d'emotes reconnus (Twitch/BTTV/7TV/FFZ, cf. /emotes)
  // par des images, tout en echappant le reste du texte normalement. On
  // decoupe sur les espaces pour comparer chaque "mot" au nom exact d'une
  // emote (comportement standard du chat Twitch).
  function renderTextWithEmotes(text) {
    return text
      .split(/(\s+)/)
      .map((token) => {
        if (/^\s+$/.test(token) || !token) return escapeHtml(token);
        const url = emoteMap[token];
        if (url) {
          return `<img class="emote" src="${escapeHtml(url)}" alt="${escapeHtml(token)}" title="${escapeHtml(token)}">`;
        }
        return escapeHtml(token);
      })
      .join('');
  }

  function playFiller(item) {
    return new Promise((resolve) => {
      resetAnimations();
      bar.classList.remove('tts-mode');

      // La promo ZEvent (variant "zevent") s'affiche en vert avec un tag
      // different, tout le reste (fun facts, horoscope, dedicace points de
      // chaine) garde le style par defaut.
      const isZevent = item && item.variant === 'zevent';
      const tagClass = isZevent ? 'filler-tag zevent' : 'filler-tag';
      const tagEmoji = isZevent ? '🟢' : '✨';
      const textClass = isZevent ? 'zevent-text' : '';
      const text = (item && item.text) || '';

      tickerText.innerHTML = `<span class="${tagClass}">${tagEmoji}</span><span class="${textClass}">${escapeHtml(text)}</span>`;

      const barWidth = bar.getBoundingClientRect().width;
      const textWidth = tickerText.getBoundingClientRect().width;
      const distance = barWidth + textWidth;
      const durationMs = Math.max(1500, (distance / SCROLL_SPEED_PX_PER_SEC) * 1000);

      const anim = tickerText.animate(
        [
          { transform: `translateX(${barWidth}px)` },
          { transform: `translateX(-${textWidth}px)` },
        ],
        { duration: durationMs, easing: 'linear', fill: 'forwards' }
      );
      anim.onfinish = resolve;
      anim.oncancel = resolve;
    });
  }

  function playTts(item) {
    return new Promise((resolve) => {
      resetAnimations();
      bar.classList.add('tts-mode');
      ttsText.textContent = item.text;

      const duration = Math.min(TTS_MAX_MS, Math.max(TTS_MIN_MS, item.text.length * TTS_MS_PER_CHAR));
      setTimeout(() => {
        bar.classList.remove('tts-mode');
        resolve();
      }, duration);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
})();
</script>
</body>
</html>
